version: '3.8'

services:
  zeronexus:
    build: .
    container_name: zeronexus_platform
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "48199:48199"

  # Optional PostgreSQL service (uncomment to activate high-concurrency DB)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: zeronexus_postgres
  #   restart: unless-stopped
