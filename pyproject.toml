[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeronexus"
version = "1.2.0"
description = "ZeroNexus (ZN) — Advanced Modular Discord Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ZeroNexus Team" }
]
dependencies = [
    "discord.py>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "sympy>=1.13.0",
    "mcstatus>=11.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "pillow>=10.3.0",
    "qrcode>=7.4.2",
    "psutil>=5.9.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "Dimension1: Discord interaction lifecycle & UI tests",
]
